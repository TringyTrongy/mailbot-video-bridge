services:
  - type: web
    name: mailbot-video-bridge
    env: python
    plan: free
    buildCommand: "python -c \"import urllib.request, zipfile, os; os.makedirs('bin', exist_ok=True); urllib.request.urlretrieve('https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip', 'deno.zip'); zipfile.ZipFile('deno.zip').extractall('bin'); os.chmod('bin/deno', 0o755); os.remove('deno.zip')\" && pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
